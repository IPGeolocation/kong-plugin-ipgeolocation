apiVersion: v1
kind: Secret
metadata:
  name: ipgeolocation-download
  namespace: kong
type: Opaque
stringData:
  # Space-separated download links from your IPGeolocation.io account. They contain your API key.
  IPGEO_URLS: "<location database link> <asn database link> <security database link>"
  # Optional signature verification (see examples/updater/ipgeolocation-update.sh):
  # IPGEO_SIGNATURE_URLS: "<location signature link> <asn signature link> <security signature link>"
  # IPGEO_PUBLIC_KEY_PEM: |
  #   -----BEGIN PUBLIC KEY-----
  #   ...
  #   -----END PUBLIC KEY-----
